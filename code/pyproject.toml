[project]
name = "whale-market"
version = "0.1.0"
description = "小蓝鲸二手集市"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25,<26",
    "fastapi>=0.165,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
whale-market = "whale_market.cli:main"

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
